image-build-smoke-export:
  image: cr.io:5000/docker:27-cli
  stage: image

  needs:
    - config-validation
    - ruff
    - mypy
    - unit-tests
    - integration-tests
    - contract-tests
    - postgres-concurrency
    - safe-e2e
    - docker-compose-validate

  before_script:
    - apk add --no-cache python gzip coreutils
    - sh .gitlab-ci-cd/scripts/wait-for-docker.sh

  script:
    - sh .gitlab-ci-cd/scripts/image-build-smoke-export.sh

  artifacts:
    when: always
    name: "verified-weekend-report-image-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 14 days

  interruptible: false

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - TAG
      when: on_success
    - when: never
