{
  "collection_mode": "live",
  "defaults": {
    "required": true,
    "expected": {
      "service_state": "running",
      "task_state_policy": {
        "failed": "FAIL",
        "rejected": "FAIL",
        "restarting": "FAIL",
        "starting": "WARNING"
      }
      # The reasoning is straightforward. failed and rejected are definitely bad.
      # A restarting task indicates instability, so I would also make that FAIL.
      # A starting task can legitimately exist during a rollout/reconciliation, so WARNING is more appropriate than immediately declaring the service broken.
      # The project's validation contract explicitly allows task states to map independently to WARNING, FAIL, or IGNORE.
    }
  },
