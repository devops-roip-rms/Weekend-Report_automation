  "sites": {
    "site1": {
      "environment_type": "docker_swarm",
      "service_inventory": "common",
      "connection": {
        "url_env": "PORTAINER_SITE1_URL",
        "endpoint_id": "<TBD>",
        "api_contract": "<TO_VERIFY>",
        "auth": {
          "type": "<VERIFY_AUTH_ENUM>",
          "token_env": "PORTAINER_SITE1_TOKEN"
        },
        "tls": {
          "verify": true,
          "ca_file_env": "PORTAINER_SITE1_CA_FILE"
        },
        "timeouts": {
          "connect_seconds": 5,
          "read_seconds": 15
        },
        "retries": {
          "attempts": 3,
          "backoff_seconds": 2
        }
      },
      "overrides": {
        "services": {}
