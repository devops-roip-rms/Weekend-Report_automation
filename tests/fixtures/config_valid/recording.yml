{
  "collection_mode": "fixture",
  "workflow": "existing_device_start_stop",
  "safety": {
    "create_device_allowed": false,
    "delete_device_allowed": false,
    "state_changing_calls_require_explicit_approval": true,
    "crash_after_start_requires_recovery": true,
    "automatic_replay_after_unknown_state": false
  },
  "manager": {
    "url_env": "RECORDING_MANAGER_WEBAPP_URL",
    "device_selection": {
      "use_existing_device_only": true,
      "required_initial_state": "not_recording",
      "no_eligible_device_status": "ERROR"
    }
  },
  "sites": {
    "site1": {
      "webapp": {
        "url_env": "RECORDING_SITE1_WEBAPP_URL",
        "capture_baseline_at_test_start": true
      },
      "server": {
        "connection_reference": "RECORDING_SITE1_SERVER",
        "capture_baseline_at_test_start": true
      }
    },
    "site2": {
      "webapp": {
        "url_env": "RECORDING_SITE2_WEBAPP_URL",
        "capture_baseline_at_test_start": true
      },
      "server": {
        "connection_reference": "RECORDING_SITE2_SERVER",
        "capture_baseline_at_test_start": true
      }
    }
  },
  "validation": {
    "baseline": {
      "capture_at_test_start": true
    },
    "after_start": {
      "site1_webapp_count_delta": 1,
      "site2_webapp_count_delta": 1,
      "site1_server_count_delta": 1,
      "site2_server_count_delta": 1
    },
    "after_stop": {
      "site1_webapp_must_return_to_baseline": true,
      "site2_webapp_must_return_to_baseline": true,
      "site1_server_must_return_to_baseline": true,
      "site2_server_must_return_to_baseline": true
    }
  },
  "polling": {
    "timeout_seconds": 120,
    "interval_seconds": 5
  },
  "result_policy": {
    "functional_mismatch_status": "FAIL",
    "technical_failure_status": "ERROR",
    "cleanup_failure_status": "ERROR",
    "cleanup_failure_requires_recovery": true
  },
  "fixture_actual": {
    "selected_device": {
      "id": "fixture-device-1",
      "name": "Fixture Device",
      "recording": false,
      "created": false,
      "deleted": false
    },
    "device_selection": {
      "success": true
    },
    "pre_start_verification": {
      "success": true,
      "recording": false
    },
    "observations": {
      "baseline": {
        "site1_webapp": {
          "success": true,
          "count": 2
        },
        "site2_webapp": {
          "success": true,
          "count": 3
        },
        "site1_server": {
          "success": true,
          "count": 4
        },
        "site2_server": {
          "success": true,
          "count": 5
        }
      },
      "after_start": {
        "site1_webapp": {
          "success": true,
          "count": 3
        },
        "site2_webapp": {
          "success": true,
          "count": 4
        },
        "site1_server": {
          "success": true,
          "count": 5
        },
        "site2_server": {
          "success": true,
          "count": 6
        }
      },
      "after_stop": {
        "site1_webapp": {
          "success": true,
          "count": 2
        },
        "site2_webapp": {
          "success": true,
          "count": 3
        },
        "site1_server": {
          "success": true,
          "count": 4
        },
        "site2_server": {
          "success": true,
          "count": 5
        }
      }
    },
    "start_action": {
      "success": true,
      "device_id": "fixture-device-1"
    },
    "stop_action": {
      "success": true,
      "device_id": "fixture-device-1"
    },
    "cleanup": {
      "success": true,
      "complete": true,
      "selected_device_recording": false
    }
  }
}
