stages:
  - validate
  - test
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

validate:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python scripts/validate_config.py --config tests/fixtures/config_valid
    - python scripts/validate_config.py --config config --expect-invalid
    - ruff check .
    - mypy app scripts

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - pytest

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t weekend-report:${CI_COMMIT_SHORT_SHA} .
  rules:
    - when: manual
