stages:
  - validate
  - test
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

validate:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python scripts/validate_config.py --config tests/fixtures/config_valid
    - python scripts/validate_config.py --config config --expect-invalid
    - ruff check .
    - mypy app scripts

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -s tests
    - python scripts/smoke_local.py

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - export POSTGRES_PASSWORD=gitlab-ci-compose-only
    - export WEEKEND_REPORT_APP_VERSION=gitlab-ci
    - export WEEKEND_REPORT_BUILD_ID=${CI_PIPELINE_ID}
    - export WEEKEND_REPORT_AUTH_PROVIDER=trusted_header
    - export WEEKEND_REPORT_AUTH_TRUSTED_HEADER=X-Authenticated-User
    - export WEEKEND_REPORT_AUTHORIZED_REVIEWERS=ci-reviewer
    - export WEEKEND_REPORT_CSRF_SIGNING_KEY=gitlab-ci-compose-only
    - docker compose -f deploy/docker/compose.yml config
    - docker build -t weekend-report:${CI_COMMIT_SHORT_SHA} .
  rules:
    - when: manual
