services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: weekend_report
      POSTGRES_USER: weekend_report
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required from deploy/docker/.env, Docker secrets, or an approved secret mechanism}

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U weekend_report -d weekend_report
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  web:
    image: ${WEEKEND_REPORT_IMAGE:-weekend-report:local}

    command:
      - uvicorn
      - app.web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    environment: &app_environment
      WEEKEND_REPORT_APP_VERSION: ${WEEKEND_REPORT_APP_VERSION:?WEEKEND_REPORT_APP_VERSION is required for portable traceability}

      WEEKEND_REPORT_BUILD_ID: ${WEEKEND_REPORT_BUILD_ID:?WEEKEND_REPORT_BUILD_ID is required for portable traceability}

      WEEKEND_REPORT_CONFIG_DIR: /app/config

      WEEKEND_REPORT_EVIDENCE_ROOT: /app/runs

      WEEKEND_REPORT_DATABASE_URL: postgresql://weekend_report:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required from deploy/docker/.env, Docker secrets, or an approved secret mechanism}@postgres:5432/weekend_report

      WEEKEND_REPORT_AUTH_MODE: ${WEEKEND_REPORT_AUTH_MODE:-production}

      WEEKEND_REPORT_AUTH_PROVIDER: ${WEEKEND_REPORT_AUTH_PROVIDER:?WEEKEND_REPORT_AUTH_PROVIDER is required in production}

      # Required only when AUTH_PROVIDER=trusted_header.
      # Application preflight decides whether it is mandatory.
      WEEKEND_REPORT_AUTH_TRUSTED_HEADER: ${WEEKEND_REPORT_AUTH_TRUSTED_HEADER:-}

      WEEKEND_REPORT_AUTHORIZED_REVIEWERS: ${WEEKEND_REPORT_AUTHORIZED_REVIEWERS:?WEEKEND_REPORT_AUTHORIZED_REVIEWERS is required for production access}

      WEEKEND_REPORT_CSRF_SIGNING_KEY: ${WEEKEND_REPORT_CSRF_SIGNING_KEY:?WEEKEND_REPORT_CSRF_SIGNING_KEY is required for production browser mutations}

      WEEKEND_REPORT_CSRF_TTL_SECONDS: ${WEEKEND_REPORT_CSRF_TTL_SECONDS:-3600}

      # Required only when AUTH_PROVIDER=local_login.
      WEEKEND_REPORT_LOCAL_USERS_FILE: ${WEEKEND_REPORT_LOCAL_USERS_FILE:-/app/secrets/local-users.json}

      WEEKEND_REPORT_SESSION_SIGNING_KEY: ${WEEKEND_REPORT_SESSION_SIGNING_KEY:-}

      WEEKEND_REPORT_SESSION_TTL_SECONDS: ${WEEKEND_REPORT_SESSION_TTL_SECONDS:-14400}

      PORTAINER_SITE1_URL: ${PORTAINER_SITE1_URL:-}
      PORTAINER_SITE1_TOKEN: ${PORTAINER_SITE1_TOKEN:-}
      PORTAINER_SITE1_CA_FILE: ${PORTAINER_SITE1_CA_FILE:-}

      PORTAINER_SITE2_URL: ${PORTAINER_SITE2_URL:-}
      PORTAINER_SITE2_TOKEN: ${PORTAINER_SITE2_TOKEN:-}
      PORTAINER_SITE2_CA_FILE: ${PORTAINER_SITE2_CA_FILE:-}

      RABBITMQ_SITE1_URL: ${RABBITMQ_SITE1_URL:-}
      RABBITMQ_SITE1_USER: ${RABBITMQ_SITE1_USER:-}
      RABBITMQ_SITE1_PASSWORD: ${RABBITMQ_SITE1_PASSWORD:-}

      RABBITMQ_SITE2_URL: ${RABBITMQ_SITE2_URL:-}
      RABBITMQ_SITE2_USER: ${RABBITMQ_SITE2_USER:-}
      RABBITMQ_SITE2_PASSWORD: ${RABBITMQ_SITE2_PASSWORD:-}

      RECORDING_MANAGER_WEBAPP_URL: ${RECORDING_MANAGER_WEBAPP_URL:-}
      RECORDING_SITE1_WEBAPP_URL: ${RECORDING_SITE1_WEBAPP_URL:-}
      RECORDING_SITE2_WEBAPP_URL: ${RECORDING_SITE2_WEBAPP_URL:-}

      SSH_PRIVATE_KEY_PATH: ${SSH_PRIVATE_KEY_PATH:-}
      SSH_KNOWN_HOSTS_PATH: ${SSH_KNOWN_HOSTS_PATH:-}

    # The base file does NOT publish this port to the host.
    # compose.direct.yml or compose.proxy.yml controls exposure.
    expose:
      - "8080"

    volumes:
      - evidence:/app/runs

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - frontend
      - backend

    restart: unless-stopped

    logging: *default_logging


  worker:
    image: ${WEEKEND_REPORT_IMAGE:-weekend-report:local}

    command:
      - python
      - -m
      - app.worker.main

    environment: *app_environment

    volumes:
      - evidence:/app/runs

    depends_on:
      postgres:
        condition: service_healthy

      web:
        condition: service_started

    networks:
      - backend

    restart: unless-stopped

    logging: *default_logging


volumes:
  db-data:
  evidence:


networks:
  frontend:

  backend:
    internal: true
