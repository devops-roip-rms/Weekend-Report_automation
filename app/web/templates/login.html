<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        http-equiv="Cache-Control"
        content="no-store"
    >

    <title>Weekend Report - Sign In</title>

    <style>
        :root {
            color-scheme: light;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #f4f7fb 0%,
                    #e9eef6 100%
                );
            color: #172033;
        }

        .login-shell {
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #dfe5ee;
            border-radius: 14px;
            box-shadow:
                0 18px 50px rgba(24, 39, 75, 0.10);
            overflow: hidden;
        }

        .login-header {
            padding: 28px 30px 18px;
            border-bottom: 1px solid #edf0f5;
        }

        .product-name {
            margin: 0;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .product-description {
            margin: 8px 0 0;
            color: #667085;
            font-size: 14px;
            line-height: 1.5;
        }

        .login-body {
            padding: 26px 30px 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cfd7e3;
            border-radius: 8px;
            background: #ffffff;
            color: #172033;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667085;
            box-shadow:
                0 0 0 3px rgba(102, 112, 133, 0.12);
        }

        .error {
            margin: 0 0 18px;
            padding: 11px 13px;
            border: 1px solid #f0b8b8;
            border-radius: 8px;
            background: #fff4f4;
            color: #9b1c1c;
            font-size: 13px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 12px 16px;
            background: #172033;
            color: #ffffff;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }

        button:hover {
            background: #25324a;
        }

        .login-footer {
            margin-top: 18px;
            color: #98a2b3;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-shell">
        <section class="login-card">
            <header class="login-header">
                <h1 class="product-name">
                    Weekend Report Automation
                </h1>

                <p class="product-description">
                    Sign in with your authorized local reviewer account.
                </p>
            </header>

            <div class="login-body">
                {% if error %}
                <div
                    class="error"
                    role="alert"
                >
                    {{ error }}
                </div>
                {% endif %}

                <form
                    method="post"
                    action="/login"
                    autocomplete="on"
                >
                    <input
                        type="hidden"
                        name="next"
                        value="{{ next_url }}"
                    >

                    <div class="field">
                        <label for="username">
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            value="{{ username }}"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="field">
                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit">
                        Sign in
                    </button>
                </form>

                <div class="login-footer">
                    Access is restricted to authorized Weekend Report reviewers.
                </div>
            </div>
        </section>
    </main>
</body>
</html>
